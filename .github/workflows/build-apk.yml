name: Build Android Bubble APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Native APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: |
          cd android-bubble-app
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SNDR-Calidad-Bubble-APK
          path: android-bubble-app/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Build Summary
        run: |
          echo "### ⚡ SNDR Calidad Bubble APK Compilado" >> $GITHUB_STEP_SUMMARY
          echo "El APK debug de la aplicación nativa Android ha sido generado con éxito en GitHub Actions." >> $GITHUB_STEP_SUMMARY
          echo "- **Versión:** v4.0.29" >> $GITHUB_STEP_SUMMARY
          echo "- **Android SDK:** 34 (Target), 26 (MinSdk)" >> $GITHUB_STEP_SUMMARY
          echo "- **Firma:** SHA-256 permanente con calidad.keystore fija" >> $GITHUB_STEP_SUMMARY
          echo "- **Artefacto:** SNDR-Calidad-Bubble-APK" >> $GITHUB_STEP_SUMMARY
